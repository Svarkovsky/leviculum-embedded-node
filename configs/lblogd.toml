# ==============================================================================
# lblogd.toml - Configuration for the NomadNet/Micron Blog Server
# ==============================================================================
# Place this file in: /tmp/mnt/sda1/home/lblogd/lblogd.toml
#
# The lblogd program searches for this file in the current working directory 
# from which it is executed. Our control script `lblog.sh` runs it directly 
# from the `/tmp/mnt/sda1/home/lblogd/` directory, expecting this config here.
# ==============================================================================

# Directory for temporary blog cache. Placed in RAM (/tmp) to prevent flash drive wear.
data_dir = "/tmp/lblogd_cache"

# Directory where your Micron markdown posts are stored (.mu files)
posts_dir = "/tmp/mnt/sda1/home/lblogd/posts"

# Directory where files you want to share over NomadNet are stored
files_dir = "/tmp/mnt/sda1/home/lblogd/files"

# Maximum size of files allowed to be shared/downloaded (10 MB)
max_file_bytes = 10485760

# Disabled to save a background thread and inotify OS resources, saving ~3.5 MB of RAM!
# Use 'killall -HUP lblogd' to manually reload posts when you add new files.
watch_posts = false

[blog]
title = "My First Reticulum Site"
author = "Administrator"
description = "Lightweight blog running directly from an embedded home router!"
language = "en"

[node]
# Instance name of this specific blog node
instance_name = "default"

# Interval in seconds to announce this blog's destination to the Reticulum mesh (6 hours)
announce_interval_secs = 21600

[web]
# Disable built-in ACME/HTTPS for resource saving on embedded router
acme = false

# Internal bind address for the web management interface
# Bind address for the HTTP Web Gateway.
# By setting this to "0.0.0.0:8180", your blog becomes fully accessible over HTTP 
# to any standard web browser on any device (phone, PC, tablet) connected to your local Wi-Fi!
http_bind = "0.0.0.0:8180"

[counter]
# Disabled to save CPU cycles and RAM by avoiding hits database tables in memory
enabled = false
